name: Build and Deploy Web Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission to Gradle wrapper
      run: chmod +x ./gradlew

    - name: Build Spring Boot app with Gradle
      run: ./gradlew clean build --no-daemon --no-build-cache

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build --no-cache -t ${{ secrets.DOCKER_IMAGE }}:${{ secrets.DOCKER_TAG }} .
        docker push ${{ secrets.DOCKER_IMAGE }}:${{ secrets.DOCKER_TAG }}

    - name: Copy docker-compose.yml to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "~/sea-turtle-web-service"

    - name: Deploy via SSH using docker-compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "Moving to dir to deployment..."
          cd ~/sea-turtle-web-service

          echo "Generating .env file from secrets..."
          cat <<EOF > .env
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          DOCKER_TAG: ${{ secrets.DOCKER_TAG }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_IN_MS=${{ secrets.JWT_EXPIRATION_IN_MS }}
          SPRING_EMAIL_HOST=${{ secrets.SPRING_EMAIL_HOST }}
          SPRING_EMAIL_PORT=${{ secrets.SPRING_EMAIL_PORT }}
          SPRING_EMAIL_USER=${{ secrets.SPRING_EMAIL_USER }}
          SPRING_EMAIL_PASS=${{ secrets.SPRING_EMAIL_PASS }}
          FLYWAY_ENABLED=${{ secrets.FLYWAY_ENABLED }}
          SFTP_URL: ${{ secrets.SFTP_URL }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          EOF

          echo "Creating network (if not exists)..."
          docker network create sea-turtle-network || true

          echo "Pulling latest image..."
          docker compose -f docker-compose.yml pull

          echo "Stopping old container if exists..."
          docker compose -f docker-compose.yml stop sea-turtle-web-service || true
          docker compose -f docker-compose.yml rm -f sea-turtle-web-service || true

          echo "Starting new container with correct name..."
          docker compose -f docker-compose.yml up -d --remove-orphans

          echo "Deployment completed!"